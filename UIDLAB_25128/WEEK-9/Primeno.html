<html>
    <head>
        <script>
            let a = 18;
            let count = 0;
            for(let i=1; i<=a; i++){
                if(a%i==0){
                    count++;
                }
                
            }
            if(count==2){
                document.write("Prime number");
            }
            else{
                document.write("Not a prime number");
            }
        </script>
    </head>
</html>
