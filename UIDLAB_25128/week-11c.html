<!DOCTYPE html>
<html>
<head>
  <title>Password Strength Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input[type="password"]:focus {
      border-color: #007BFF;
      outline: none;
    }
    #passMsg {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .weak {
      color: red;
    }
    .strong {
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Password Strength</h2>
    <label for="password">Password:</label>
    <input type="password" id="password" onkeyup="checkPasswordStrength()" placeholder="Enter password">
    <span id="passMsg"></span>
  </div>

  <script>
    function checkPasswordStrength() {
      let pwd = document.getElementById("password").value;
      let msg = document.getElementById("passMsg");
      if (pwd.length < 6) {
        msg.innerHTML = "Weak password";
        msg.className = "weak";
      } else {
        msg.innerHTML = "Strong password";
        msg.className = "strong";
      }
    }
  </script>
</body>
</html>
