<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sort Three Numbers</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1506784983877-45594efa4cbe'); /* abstract geometric background */
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    input {
      margin: 10px;
      padding: 8px;
      width: 60px;
      text-align: center;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #0078D7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sort Three Numbers</h2>
    <input type="number" id="num1" placeholder="Num 1">
    <input type="number" id="num2" placeholder="Num 2">
    <input type="number" id="num3" placeholder="Num 3">
    <br>
    <button onclick="sortThreeNumbers()">Sort</button>
  </div>

  <script>
    function sortThreeNumbers() {
      let a = parseFloat(document.getElementById("num1").value);
      let b = parseFloat(document.getElementById("num2").value);
      let c = parseFloat(document.getElementById("num3").value);

      // Conditional swaps to sort ascending
      if (a > b) {
        let temp = a; a = b; b = temp;
      }
      if (b > c) {
        let temp = b; b = c; c = temp;
      }
      if (a > b) {
        let temp = a; a = b; b = temp;
      }

      alert("Sorted order: " + a + ", " + b + ", " + c);
    }
  </script>
</body>
</html>
