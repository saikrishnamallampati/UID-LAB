<!DOCTYPE html>
<html >
<head>
    <title>WEEK-10</title>
    <style>
       
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            width: 350px;  
        }
        h2 {
            color: white;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ffdd57;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 15px;
            color: #ddd;
            font-size: 12px;
        }
</style>
</head>
<body>
<div class="container">
    <h2> Calculator</h2>

    <button onclick="findSign()">Sign of Product</button>
    <button onclick="sortNumbers()">Sort 3 Numbers</button>
    <button onclick="findLargest()">Largest of 5 Numbers</button>
    <button onclick="checkOddEven()">Odd / Even (0–15)</button>
    <button onclick="calculateGrade()">Student Grade</button>   
</div>
<script>
function findSign() {
    let a = parseInt(prompt("Enter first number:"));
    let b = parseInt(prompt("Enter second number:"));
    let c = parseInt(prompt("Enter third number:"));
    let product = a * b * c;

    if (product > 0) alert("Sign is +");
    else if (product < 0) alert("Sign is -");
    else alert("Product is zero");
}
function sortNumbers() {
    let a = parseInt(prompt("Enter first number:"));
    let b = parseInt(prompt("Enter second number:"));
    let c = parseInt(prompt("Enter third number:"));

    let nums = [a, b, c];
    nums.sort((x, y) => x - y);

    alert("Sorted: " + nums.join(", "));
}
function findLargest() {
    let nums = [];

    for (let i = 0; i < 5; i++) {
        nums[i] = parseInt(prompt("Enter number " + (i + 1)));
    }

    let max = nums[0];

    for (let i = 1; i < nums.length; i++) {
        if (nums[i] > max) max = nums[i];
    }

    alert("Largest number: " + max);
}
function checkOddEven() {
    let result = "";

    for (let i = 0; i <= 15; i++) {
        result += i + (i % 2 === 0 ? " is even\n" : " is odd\n");
    }

    alert(result);
}

function calculateGrade() {
    let marks = [];
    let sum = 0;

    for (let i = 0; i < 6; i++) {
        marks[i] = parseInt(prompt("Enter marks for subject " + (i + 1)));
        sum += marks[i];
    }

    let avg = sum / 6;
    let grade;

    if (avg >= 90) grade = "A+";
    else if (avg >= 80) grade = "A";
    else if (avg >= 70) grade = "B";
    else if (avg >= 60) grade = "C";
    else if (avg >= 50) grade = "D";
    else grade = "F";

    alert("Average: " + avg + "\nGrade: " + grade);
}

</script>

</body>
</html>
