<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Number Validation</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background: #f5f5f5;
    }
    .container {
        width: 320px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 5px;
        outline: none;
        transition: 0.3s;
    }
    input.valid {
        border-color: green;
    }
    input.invalid {
        border-color: red;
    }
    #error {
        margin-top: 8px;
        color: red;
        font-size: 14px;
        height: 18px;
    }
    button {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #005fcc;
    }
</style>
</head>
<body>
<div class="container">
    <h3>Mobile Number Validation</h3>

    <input type="text" id="mobile" placeholder="Enter mobile number">
    <p id="error"></p>

    <button onclick="validate()">Validate</button>
</div>
<script>
    const mobile = document.getElementById("mobile");
    const error = document.getElementById("error");    
    mobile.addEventListener("input", () => {
        const regex = /^[6-9]\d{9}$/;

        if (regex.test(mobile.value)) {
            mobile.classList.add("valid");
            mobile.classList.remove("invalid");
            error.textContent = "";
        } else {
            mobile.classList.add("invalid");
            mobile.classList.remove("valid");
            error.textContent = "Enter a valid 10-digit mobile number";
        }
    });    
    function validate() {
        const regex = /^[6-9]\d{9}$/;

        if (regex.test(mobile.value)) {
            alert("Valid Mobile Number");
        } else {
            alert("Invalid Mobile Number");
        }
    }
</script>
</body>
</html>
