<!DOCTYPE html>
<html>
<head>
  <title>Email Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #007BFF;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .valid {
      color: green;
    }
    .invalid {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Email Validation</h2>
    <input type="text" id="email" placeholder="Enter email">
    <button onclick="checkEmail()">Check</button>
    <p id="result"></p>
  </div>

  <script>
    function checkEmail() {
      let email = document.getElementById("email").value;
      let pattern = /^[a-zA-Z0-9._]+@[a-zA-Z]+\.[a-zA-Z]{2,}$/;
      let result = document.getElementById("result");

      if (pattern.test(email)) {
        result.innerHTML = "Valid Email";
        result.className = "valid";
      } else {
        result.innerHTML = "Invalid Email";
        result.className = "invalid";
      }
    }
  </script>
</body>
</html>
