<!DOCTYPE html>
<html>
    <body>
        <h2>The datalist Element</h2>
        <p>the datalist element specifues a list of predefined options for an input element.</p>
        <form>
            <input list="browsers"name="browser">
            <datalist id="browsers">
            <option value="Edge">
            <option value="FIrefox">
            <option value="Chrome">
            <option value="Opera">
            <option value="Safari">
            </datalist>
            <input type="submit">
        </form>
        </h2>
    </body>
</html>
